# Makes the AI voices (npm run voices) on GitHub and saves them in the repo; the deploy then publishes them.
# Run it from the Actions tab → "Make voices" → Run workflow. Needs the secret SARVAM_API_KEY.
name: Make voices
on:
  workflow_dispatch:
    inputs:
      options:
        description: 'Extra options, e.g. --lang kn --force --voice kn=kavya   or   --only cow,pig'
        required: false
        default: ''
permissions: { contents: write, actions: write }
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run voices -- ${{ github.event.inputs.options }}
        env: { SARVAM_API_KEY: '${{ secrets.SARVAM_API_KEY }}' }
      - name: Save the voices
        run: |
          git config user.name "little-barn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recordings public/audio
          git diff --cached --quiet || git commit -m "Voices: npm run voices ${{ github.event.inputs.options }}"
          git push
      - name: Publish (pushes made by a workflow don't start the deploy by themselves)
        run: gh workflow run deploy.yml --ref main
        env: { GH_TOKEN: '${{ github.token }}' }
