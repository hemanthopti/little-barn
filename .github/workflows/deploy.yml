# Every push to main builds the game and uploads it to play.starlinkwatch.com (Hostinger, over FTPS).
# Repo secrets needed (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.starlinkwatch.com  (Hostinger hPanel → Files → FTP Accounts)
#   FTP_USERNAME  FTP_PASSWORD
#   FTP_DIR       folder of the subdomain on the server, ending in /  e.g. public_html/play/
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { HAS_FTP: "${{ secrets.FTP_SERVER != '' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { OUT_DIR: dist }
      - if: env.HAS_FTP != 'true'
        run: echo '::warning::Built OK, but nothing uploaded - add the FTP secrets to publish.'
      - name: Tidy the server name (drops ftp://, a port, spaces, a trailing /)
        id: ftp
        if: env.HAS_FTP == 'true'
        env: { RAW: '${{ secrets.FTP_SERVER }}' }
        run: |
          host=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "::add-mask::$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          if [[ "$host" =~ ^[0-9.]+$ ]]; then echo "Server is an IP address."
          elif getent ahosts "$host" > /dev/null; then echo "Server name found."; else echo "::error::The FTP_SERVER secret is not a server name that exists. Copy the FTP IP (or hostname) from Hostinger hPanel → Files → FTP Accounts."; exit 1; fi
      - if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
      - name: Check the live site serves this build
        if: env.HAS_FTP == 'true'
        run: |
          sleep 5
          live=$(curl -s "https://play.starlinkwatch.com/index.html?nocache=$RANDOM" | grep -o 'assets/index-[^"]*\.js' | head -1)
          built=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "built: $built"; echo "live:  $live"
          if [ "$live" = "$built" ]; then echo "Live site is up to date."; else echo "::warning::play.starlinkwatch.com is serving a different build ($live). FTP_DIR may point at another folder than the one the subdomain uses."; fi
